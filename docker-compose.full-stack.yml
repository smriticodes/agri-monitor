# Build context for plant-classifier / plant-trainer MUST exist on the host and contain
# Dockerfile.cuda, train.py, serve.py, requirements-docker-cuda.txt.
#
# Option A — full git clone on the server:
#   cd /mnt/mainpool/apps && git clone <your-repo> agri-monitor && cd agri-monitor
#   (default context ./cv-backend works)
#
# Option B — compose lives elsewhere: set in a .env next to this file:
#   AGRI_MONITOR_CV_BACKEND=/absolute/path/to/cv-backend
#
# If context is wrong, build fails and Compose tries to "pull" agri-monitor-plant-cv:cuda → access denied.
#
# First-time host dirs for app file storage (agri-monitor service bind mount):
#   mkdir -p /mnt/mainpool/apps/agri-monitor/uploads/{originals,processed,temp,models,backups}

services:
  # Applies db/migrations/*.sql against an existing Postgres volume.
  # schema.sql only runs on first empty data dir; upgrades need this step.
  db-migrate:
    image: postgres:16
    container_name: agri-monitor-db-migrate
    volumes:
      - ./db/migrations:/migrations:ro
    environment:
      PGPASSWORD: password
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until pg_isready -h postgres -U agri_monitor -d agri_monitor >/dev/null 2>&1; do sleep 1; done
        for f in /migrations/*.sql; do
          echo "Applying $$f"
          psql -v ON_ERROR_STOP=1 -h postgres -U agri_monitor -d agri_monitor -f "$$f"
        done
    depends_on:
      - postgres
    restart: "no"
    networks:
      - agri-monitor_net

  agri-monitor:
    image: ghcr.io/smriticodes/agri-monitor:latest
    container_name: agri-monitor
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - db-migrate
    ports:
      - "3000:3000"
    environment:
      APP_NAME: Agri Monitor Vision Console
      NEXT_PUBLIC_APP_NAME: Agri Monitor Vision Console
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_AUTO_REFRESH_MS: 15000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: agri_monitor
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: agri_monitor
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: agri-monitor-image-embeddings
      CV_SPECIES_INFERENCE_URL: http://plant-classifier:8765/v1/classify
      # Bind mount below; host should have originals/processed/temp (see comment).
      STORAGE_ROOT: /data/agri-monitor
      STORAGE_ORIGINALS_DIR: /data/agri-monitor/originals
      STORAGE_PROCESSED_DIR: /data/agri-monitor/processed
      STORAGE_TEMP_DIR: /data/agri-monitor/temp
    volumes:
      # Host layout: .../uploads/{originals,processed,temp,models,backups}
      - /mnt/mainpool/apps/agri-monitor/uploads:/data/agri-monitor
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - agri-monitor_net

  postgres:
    image: postgres:16
    container_name: agri-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agri_monitor
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agri_monitor
    volumes:
      - /mnt/mainpool/apps/agri-monitor/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - agri-monitor_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agri-monitor-qdrant
    restart: unless-stopped
    volumes:
      - /mnt/mainpool/apps/agri-monitor/qdrant/storage:/qdrant/storage
      - /mnt/mainpool/apps/agri-monitor/qdrant/snapshots:/qdrant/snapshots
    ports:
      - "6333:6333"
      - "6334:6334"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - agri-monitor_net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: agri-monitor-watchtower
    restart: unless-stopped
    command:
      - --label-enable
      - --interval
      - "300"
      - --cleanup
      - --rolling-restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - agri-monitor_net

  plant-trainer:
    build:
      context: ${AGRI_MONITOR_CV_BACKEND:-./cv-backend}
      dockerfile: Dockerfile.cuda
    image: agri-monitor-plant-cv:cuda
    container_name: plant-trainer
    restart: unless-stopped
    working_dir: /workspace
    command: sleep infinity
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /mnt/mainpool/apps/agri-monitor-train:/workspace
      - /mnt/mainpool/datasets/plantvillage:/data/plantvillage:ro
      # Optional multi-dataset training (see cv-backend/README.md):
      # - /mnt/mainpool/datasets/plantdoc:/data/plantdoc:ro
      # - /mnt/mainpool/datasets/plant-leaf:/data/plant-leaf:ro
    gpus:
      - driver: nvidia
        count: 1
        capabilities: [gpu]
    networks:
      - agri-monitor_net

  plant-classifier:
    build:
      context: ${AGRI_MONITOR_CV_BACKEND:-./cv-backend}
      dockerfile: Dockerfile.cuda
    image: agri-monitor-plant-cv:cuda
    container_name: plant-classifier
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      USE_CLAHE: "0"
    command:
      - python
      - /app/serve.py
      - --checkpoint
      - /workspace/artifacts/best.pt
      - --classes
      - /workspace/artifacts/classes.json
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    working_dir: /app
    volumes:
      - /mnt/mainpool/apps/agri-monitor-train:/workspace:ro
    ports:
      - "8765:8765"
    gpus:
      - driver: nvidia
        count: 1
        capabilities: [gpu]
    networks:
      - agri-monitor_net

networks:
  agri-monitor_net:
    driver: bridge
